name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: windows-x64 (MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate syscall table
        shell: pwsh
        run: |
          python tools/gen_syscalls.py spec/master.txt src/generated/syscalls.h
          Get-Content src/generated/syscalls.h -TotalCount 4

      - name: Build darwinnt.exe
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $gcc = "C:\ProgramData\chocolatey\bin\x86_64-w64-mingw32-gcc.exe"
          if (!(Test-Path $gcc)) { $gcc = (Get-Command x86_64-w64-mingw32-gcc).Source }
          New-Item -ItemType Directory -Force build | Out-Null
          & $gcc -std=c11 -Wall -Wextra -Wpedantic -O2 -static -Iinclude -Isrc `
            src/main.c src/dnt_macho.c src/dnt_path.c src/dnt_syscall.c `
            src/dnt_vfs.c src/dnt_port_win.c src/dnt_win.c `
            src/dnt_cpu.c src/dnt_exec.c src/dnt_bind.c `
            -o build/darwinnt.exe
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          & build\darwinnt.exe --test
          & build\darwinnt.exe --translate /var/tmp/example
          & build\darwinnt.exe --selftest-fs
          if ($LASTEXITCODE -ne 0) { throw "filesystem self-test failed" }

      - name: Execute real Darwin binaries
        shell: pwsh
        run: |
          # The fixtures are checked in, built on Linux by the tests job, or by
          # tools/build-fixtures.sh locally. Verify a guest program really runs.
          # --info first: proves the exe can read the file and parse it, which
          # separates "crashes at startup" from "crashes in the interpreter".
          & build\darwinnt.exe --info tests\fixtures\hello.macho
          Write-Host "info exit=$LASTEXITCODE"
          $h = Start-Process -FilePath build\darwinnt.exe -ArgumentList "--run","tests\fixtures\hello.macho" -NoNewWindow -Wait -PassThru
          Write-Host "run exit=$($h.ExitCode)"
          if ($LASTEXITCODE -ne 0) { throw "hello.macho failed" }
          $e = Start-Process -FilePath build\darwinnt.exe -ArgumentList "--run","tests\fixtures\exitcode.macho" -NoNewWindow -Wait -PassThru
          $code = $e.ExitCode
          Write-Host "exitcode.macho returned $code"
          if ($code -ne 42) { throw "exitcode.macho returned $code, expected 42" }
          Get-Item build\darwinnt.exe | Select-Object Name,Length

      - name: Build GUI (darwinnt-gui.exe)
        shell: pwsh
        run: |
          $gcc = "C:\ProgramData\chocolatey\bin\x86_64-w64-mingw32-gcc.exe"
          if (!(Test-Path $gcc)) { $gcc = (Get-Command x86_64-w64-mingw32-gcc).Source }
          & $gcc -std=c11 -Wall -Wextra -O2 -static -municode -mwindows `
            -Iinclude -Isrc `
            src/gui_win.c src/dnt_macho.c src/dnt_path.c src/dnt_syscall.c `
            src/dnt_vfs.c src/dnt_port_win.c src/dnt_win.c `
            src/dnt_cpu.c src/dnt_exec.c src/dnt_bind.c `
            -lcomdlg32 -lgdi32 -luser32 -lshell32 `
            -o build\darwinnt-gui.exe
          if ($LASTEXITCODE -ne 0) { throw "gui build failed" }
          Get-Item build\darwinnt-gui.exe | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: darwinnt-windows-x64
          path: build/darwinnt.exe
          if-no-files-found: error

  tests:
    name: host tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate syscall table
        run: python3 tools/gen_syscalls.py spec/master.txt src/generated/syscalls.h
      - name: Install clang + lld (fixture toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld

      - name: Build Mach-O fixtures with the real toolchain
        run: |
          set -e
          # ld64.lld ships with the lld package on Ubuntu
          if ! command -v ld64.lld >/dev/null; then
            for c in ld64.lld /usr/lib/llvm-*/bin/ld64.lld; do
              [ -x "$c" ] && ln -sf "$c" /usr/local/bin/ld64.lld && break
            done
          fi
          sh tools/build-fixtures.sh

      - name: Build and run suites
        run: |
          set -e
          CC="gcc -std=c11 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined"
          I="-Iinclude -Isrc"
          $CC $I tests/test_macho.c tests/fixture.c src/dnt_macho.c -o build_test_macho
          $CC $I tests/test_path.c src/dnt_path.c -o build_test_path
          $CC $I tests/test_syscall.c src/dnt_syscall.c src/dnt_vfs.c \
              src/dnt_path.c src/dnt_port_posix.c -o build_test_syscall
          $CC $I tests/test_vfs.c src/dnt_vfs.c src/dnt_path.c src/dnt_port_posix.c \
              -o build_test_vfs
          $CC $I tests/test_syscalls_fs.c src/dnt_syscall.c src/dnt_vfs.c \
              src/dnt_path.c src/dnt_port_posix.c -o build_test_syscalls_fs
          ./build_test_macho
          ./build_test_path
          ./build_test_syscall
          $CC $I tests/test_exec.c src/dnt_exec.c src/dnt_cpu.c src/dnt_syscall.c \
              src/dnt_macho.c src/dnt_vfs.c src/dnt_path.c src/dnt_port_posix.c \
              src/dnt_bind.c -o build_test_exec
          ./build_test_vfs
          ./build_test_syscalls_fs
          ./build_test_exec
      - name: Fuzz the Mach-O parser
        run: |
          cat > fuzz_main.c <<'EOF'
          #include "dnt_macho.h"
          #include "dnt_fixture.h"
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          static void cb(void*u,uint64_t s,const char*n,int64_t a){(void)u;(void)s;(void)n;(void)a;}
          int main(void){
            srand(1);
            for(int iter=0;iter<20000;iter++){
              dnt_fixture fx; dnt_fixture_chained(&fx,"_write");
              int n=1+rand()%8;
              for(int i=0;i<n;i++) fx.data[rand()%fx.len]^=(uint8_t)(1+rand()%255);
              dnt_image img;
              if(dnt_macho_parse(fx.data,fx.len,&img)==0){
                uint8_t*copy=malloc(fx.len); memcpy(copy,fx.data,fx.len);
                dnt_macho_apply_fixups(&img,copy,cb,NULL); free(copy);
              }
              dnt_fixture_free(&fx);
            }
            printf("fuzz: 20000 mutated images, no crash\n");
            return 0;
          }
          EOF
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -Iinclude -Isrc \
            fuzz_main.c tests/fixture.c src/dnt_macho.c -o build_fuzz
          ./build_fuzz
